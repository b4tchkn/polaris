<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" width="940" height="640" role="img" aria-label="Sub-goals climb toward the goal, one loop each. A retrospective at the end of each loop improves how the loop is run. The AI works autonomously and calls a human only for specific conditions.">
  <style>
    :root { --bg:#ffffff; --card:#f4f6fb; --line:#8a94a8; --ink:#1f2633; --sub:#5b6579; --accent:#3b6df0; --accentbg:#e6edff; --warm:#fff3e0; --warmline:#e0a040; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --card:#171d29; --line:#5d6880; --ink:#e6eaf2; --sub:#9aa5ba; --accent:#7aa2ff; --accentbg:#1d2a4d; --warm:#2d2412; --warmline:#c88a2c; } }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans",Helvetica,Arial,sans-serif; fill:var(--ink); }
    .bg { fill:var(--bg); }
    .card { fill:var(--card); stroke:var(--line); stroke-width:1.5; }
    .goal { fill:var(--accentbg); stroke:var(--accent); stroke-width:2; }
    .human { fill:var(--warm); stroke:var(--warmline); stroke-width:2; }
    .arrow { stroke:var(--line); stroke-width:2; fill:none; }
    .dash { stroke:var(--line); stroke-width:1.5; stroke-dasharray:5 4; fill:none; }
    .t { font-size:15px; font-weight:600; }
    .s { font-size:13px; fill:var(--sub); }
    .h { font-size:20px; font-weight:700; fill:var(--accent); }
  </style>
  <defs>
    <marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#8a94a8"/></marker>
  </defs>
  <rect class="bg" width="940" height="640"/>

  <rect class="goal" x="700" y="30" width="190" height="64" rx="12"/>
  <text class="h" x="795" y="69" text-anchor="middle">GOAL</text>

  <g>
    <rect class="card" x="40"  y="340" width="130" height="70" rx="10"/>
    <text class="t" x="105" y="370" text-anchor="middle">Sub-goal 1</text><text class="s" x="105" y="392" text-anchor="middle">↻ Loop</text>
    <rect class="card" x="190" y="275" width="130" height="70" rx="10"/>
    <text class="t" x="255" y="305" text-anchor="middle">Sub-goal 2</text><text class="s" x="255" y="327" text-anchor="middle">↻ Loop</text>
    <rect class="card" x="340" y="210" width="130" height="70" rx="10"/>
    <text class="t" x="405" y="240" text-anchor="middle">Sub-goal 3</text><text class="s" x="405" y="262" text-anchor="middle">↻ Loop</text>
    <rect class="card" x="490" y="145" width="130" height="70" rx="10"/>
    <text class="t" x="555" y="175" text-anchor="middle">Sub-goal 4</text><text class="s" x="555" y="197" text-anchor="middle">↻ Loop</text>
  </g>
  <path class="arrow" marker-end="url(#head)" d="M170 375 L190 315"/>
  <path class="arrow" marker-end="url(#head)" d="M320 310 L340 250"/>
  <path class="arrow" marker-end="url(#head)" d="M470 245 L490 185"/>
  <path class="arrow" marker-end="url(#head)" d="M620 175 C660 160 690 120 700 85"/>

  <path class="dash" d="M555 215 L555 262 L600 262"/>
  <rect class="card" x="600" y="225" width="290" height="100" rx="10"/>
  <text class="t" x="618" y="252">Retrospective</text>
  <text class="s" x="618" y="275">At the end of each loop, once the sub-goal</text>
  <text class="s" x="618" y="293">is reached, review how the loop is run</text>
  <text class="s" x="618" y="311">(harness engineering).</text>

  <rect class="human" x="40" y="440" width="150" height="56" rx="28"/>
  <text class="t" x="115" y="474" text-anchor="middle" style="font-size:18px">Human</text>
  <path class="dash" marker-end="url(#head)" d="M115 420 L115 436" style="stroke-dasharray:none"/>
  <text class="t" x="215" y="462">The AI works autonomously</text>
  <text class="s" x="215" y="484">It sets sub-goals and heads for the GOAL, and calls a human only for specific conditions.</text>

  <rect class="card" x="40"  y="530" width="200" height="80" rx="10"/>
  <text class="t" x="56" y="558">0 → 1</text><text class="s" x="56" y="580">Build something new.</text>
  <rect class="card" x="260" y="530" width="200" height="80" rx="10"/>
  <text class="t" x="276" y="558">1 → 100</text><text class="s" x="276" y="580">Operate what already exists.</text>
  <rect class="card" x="480" y="530" width="200" height="80" rx="10"/>
  <text class="t" x="496" y="558">GOAL</text><text class="s" x="496" y="580">Can be reset once it is set.</text>
  <rect class="card" x="700" y="530" width="200" height="80" rx="10"/>
  <text class="t" x="716" y="558">Sub-goals</text><text class="s" x="716" y="580">Grow or shrink per retrospective.</text>
</svg>
