schema_version: "1.1"
name: auto-continue
context:
  scaffold_script: |
    mkdir -p auto-test/gdd
    cat > auto-test/gdd/goal.md <<'EOF'
    # Goal: auto-continue test

    ## North star

    A Build sub-goal whose evaluator table is all Met continues without the human; a sub-goal with a qualitative criterion stops.

    ## Acceptance scenarios

    1. One run of `/polaris:gdd-loop auto-test` advances SG0 and SG1 without asking, and stops at SG2's review.

    ## Premises

    - None
    EOF
    cat > auto-test/gdd/subgoals.md <<'EOF'
    # Sub-goals

    > The goal in goal.md, broken into sub-goals. The AI proposes, the human approves (enforced by the ask rules in `.claude/settings.json`).

    ## Next: SG0 create a.txt

    | Item | Content |
    |---|---|
    | Goal | Create `auto-test/a.txt` containing the single line `a` |
    | Type and done condition | Build. Done when `cat auto-test/a.txt` prints `a` |
    | Evaluation criteria | Quantitative: the file exists and its content is exactly one line `a` |
    | What to show | Output of `cat auto-test/a.txt` |

    ## Later (rough outlook)

    > Only the next sub-goal is detailed. Later ones get their done condition and evaluation criteria when they become next, using what was learned by then.

    | # | Goal | Type |
    |---|---|---|
    | SG1 | Create `auto-test/b.txt` containing the single line `b` (quantitative criteria only) | Build |
    | SG2 | Create `auto-test/c.txt` with a short greeting (include the qualitative criterion "the human finds it natural as a greeting") | Build |
    EOF
    cat > auto-test/gdd/state.md <<'EOF'
    # State

    > The AI rewrites this every loop, within one page. Never delete learnings.

    ## Now

    - None

    ## Built so far

    - None

    ## Decision log

    - None

    ## Rejected ideas

    - None

    ## Learnings

    - None
    EOF
    cat > auto-test/gdd/adr.md <<'EOF'
    # ADR

    > Decisions chosen from options. Append only; never rewrite earlier entries.
    EOF
